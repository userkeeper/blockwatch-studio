[package]
name = "bw-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
once_cell = "1"
regex = "1"

# QR-code detection — pure Rust port of the C library `quirc`. Decodes
# QR payloads + returns the four corner points in image coordinates,
# which we collapse into an axis-aligned bbox for blurring.
rqrr = "0.7"

# All optional — pull in only when we wire OCR-side dependencies.
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = "1"

[lints]
workspace = true
