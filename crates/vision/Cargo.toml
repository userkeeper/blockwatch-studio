[package]
name = "bw-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
bw-core = { path = "../core" }
bw-capture = { path = "../capture" }
thiserror = { workspace = true }
tracing = { workspace = true }

# Tract — pure-Rust ONNX inference. Picked over `ort` (which had
# version-mismatch bugs against `ort-sys` rc.12 at the time we evaluated)
# because tract has zero native dependencies — no DLL bundling, no
# install-time gymnastics, just `cargo build` and it works. About 2×
# slower than ORT's CPU provider in benchmarks, which is irrelevant
# next to our 10 fps budget: a 40 ms YOLOv8n inference becomes 80 ms,
# still well inside the per-frame envelope.
tract-onnx = "0.21"
ndarray = "0.16"

image = { workspace = true }

[lints]
workspace = true
