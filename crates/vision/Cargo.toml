[package]
name = "bw-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
bw-core = { path = "../core" }
bw-capture = { path = "../capture" }
thiserror = { workspace = true }
tracing = { workspace = true }

# ONNX Runtime (`ort`) is intentionally NOT a dependency at Phase 0.
# Reason: `ort` 2.0.0-rc.x is currently in an unstable rc-series with
# version-mismatch bugs against `ort-sys` rc.12 (`SessionOptionsAppend-
# ExecutionProvider_VitisAI` field missing). We will add `ort` back as
# a dep in Phase 1 once we either pin to a known-good rc pair or wait
# for the 2.0 stable release. Until then, the vision crate compiles
# cleanly without it — the inference path is stubbed.
#
# ort = { version = "2.0.0-rc.10", default-features = false, features = ["copy-dylibs", "load-dynamic"] }
# ndarray = "0.16"

image = { workspace = true }

[lints]
workspace = true
