[package]
name = "bw-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
bw-core = { path = "../core" }
thiserror = { workspace = true }
tracing = { workspace = true }

# xcap gives us one capture API across Win/macOS/Linux. The per-OS
# modules in this crate are mostly thin wrappers that select the right
# `xcap::Monitor` and translate its frame into our `Frame` type.
xcap = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Win32 APIs for foreground-window inspection. We bind only what
# `window_info::windows.rs` needs — GetForegroundWindow, GetWindowText,
# GetWindowRect, GetWindowThreadProcessId.
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[lints]
workspace = true
